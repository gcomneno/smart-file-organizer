# Compatibility default: built-in semantic rules are
# evaluated before configured rules. Use "configured-first"
# when local rules must override applicable built-ins.
semantic_rule_precedence = "builtins-first"

# Optional: "personal-it" is the compatibility default. "minimal" keeps
# only extension, special-case, and fallback organization.
# profile = "minimal"

# Disable selected built-ins by their stable IDs.
disabled_builtin_rules = []

# Example configuration for smart-file-organizer.
#
# Keep real/private rules outside Git. Use this file only as a public template.

# Inbox for documents that do not match any semantic rule.
fallback_folder = "documents/inbox"

[[semantic_rules]]
folder = "documents/demo-utility"
keywords = ["synthetic invoice", "demo utility"]

[[semantic_rules]]
folder = "learning/demo-course"
keywords = ["demo course", "training notes"]

# Optional regex patterns match normalized path text (lowercase, separators -> spaces).
# [[semantic_rules]]
# folder = "documents/demo-dated-reports"
# patterns = ["\\d{8} demo report \\d+"]
