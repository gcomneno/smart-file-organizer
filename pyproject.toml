[project]
name = "smart-file-organizer"
version = "0.5.0"
description = "A safe Python CLI for planning and applying file organization workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Giancarlo Cicellyn Comneno", email = "giancarlo.cicellyn@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "cli",
    "file-organization",
    "filesystem",
    "productivity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "pypdf>=6.12.2",
]

[project.urls]
Homepage = "https://github.com/gcomneno/smart-file-organizer"
Repository = "https://github.com/gcomneno/smart-file-organizer"
Issues = "https://github.com/gcomneno/smart-file-organizer/issues"
Changelog = "https://github.com/gcomneno/smart-file-organizer/blob/main/CHANGELOG.md"
Releases = "https://github.com/gcomneno/smart-file-organizer/releases"

[project.scripts]
smart-file-organizer = "smart_file_organizer.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.49",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
