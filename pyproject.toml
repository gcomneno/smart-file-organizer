[project]
name = "smart-file-organizer"
version = "0.3.2"
description = "A safe Python CLI for planning and applying file organization workflows."
readme = "README.md"
authors = [
    { name = "Giancarlo Cicellyn Comneno", email = "giancarlo.cicellyn@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.12.2",
]

[project.scripts]
smart-file-organizer = "smart_file_organizer.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.49",
]


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.pytest.ini_options]
testpaths = ["tests"]
