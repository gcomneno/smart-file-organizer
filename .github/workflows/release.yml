name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          package_version = project["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{package_version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"tag {tag!r} does not match package version "
                  f"{package_version!r}; expected {expected_tag!r}"
              )
          print(f"Verified release tag {tag} for package version {package_version}")
          PY
      - name: Build reproducible release artifacts
        run: scripts/build-release-artifacts.sh dist
      - name: Smoke test installed wheel on Python 3.11
        env:
          UV_PYTHON: "3.11"
        run: scripts/smoke-installed-package.sh dist/*.whl
      - name: Smoke test installed wheel on Python 3.12
        env:
          UV_PYTHON: "3.12"
        run: scripts/smoke-installed-package.sh dist/*.whl
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
